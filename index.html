<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      try {
        if (JSON.parse(window.localStorage.getItem('themeMode')) === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <link rel="stylesheet" href="styles.css">
    <title>${title}</title>
    <!--${customHead}-->
    <style>
      /* Brand loader: the Sync Point symbol on paper (navy) / ink (dark), aqua pulse on the point. */
      .loader {
        position: fixed; inset: 0; margin: auto; width: 56px; height: 56px;
      }
      .loader path, .loader circle { fill: #102C54; }
      html.dark .loader path, html.dark .loader circle { fill: #35D7D6; }
      .loader circle { transform-origin: 50px 50px; animation: lp 1.2s ease-in-out infinite; }
      @keyframes lp { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.55); } }
      @media (prefers-reduced-motion: reduce) { .loader circle { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use viper fleet.</noscript>
    <div id="root" class="root"></div>
    <svg class="loader" viewBox="0 0 100 100" aria-hidden="true"><path d="M44 8 H68 C81.255 8 92 18.745 92 32 V56 H73 V33 C73 29.686 70.314 27 67 27 H44 Z M56 92 H32 C18.745 92 8 81.255 8 68 V44 H27 V67 C27 70.314 29.686 73 33 73 H56 Z"/><circle cx="50" cy="50" r="9"/></svg>
    <script type="module" src="src/index.jsx" onerror="alert('Loading error.')"></script>
  </body>
</html>
