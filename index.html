<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      try {
        if (JSON.parse(window.localStorage.getItem('themeMode')) === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <link rel="stylesheet" href="styles.css">
    <title>${title}</title>
    <!--${customHead}-->
    <style>
      .loader {
        position: fixed; inset: 0; margin: auto;
        width: 44px; aspect-ratio: 1; box-sizing: content-box; animation: ll 0.9s infinite linear;
        border-radius: 50%; border: 4px solid rgba(79, 70, 229, 0.18); border-right-color: #4f46e5;
      }
      @keyframes ll {to{transform: rotate(1turn)}}
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use <a href="https://www.traccar.org/">Traccar GPS Tracking System</a>.</noscript>
    <div id="root" class="root"></div>
    <div class="loader"></div>
    <script type="module" src="src/index.jsx" onerror="alert('Loading error.')"></script>
  </body>
</html>
