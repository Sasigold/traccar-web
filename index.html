<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="${colorPrimary}" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="${title}" />
    <meta name="description" content="${description}" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      try {
        if (JSON.parse(window.localStorage.getItem('themeMode')) === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <link rel="stylesheet" href="styles.css">
    <title>${title}</title>
    <!--${customHead}-->
  </head>
  <body>
    <noscript><p dir="rtl" lang="he">כדי להשתמש ב-viper fleet יש להפעיל JavaScript בדפדפן.</p><p dir="ltr" lang="en">Enable JavaScript to use viper fleet.</p></noscript>
    <div id="root" class="root"></div>
    <!-- Brand loader (styles in styles.css; same markup as src/common/components/brand/BrandLoader.jsx). -->
    <svg class="loader vf-loader" viewBox="0 0 100 100" role="progressbar" aria-label="viper fleet">
      <rect class="vf-loader__tile" width="100" height="100" rx="22" />
      <g transform="translate(14 14) scale(.72)">
        <circle class="vf-loader__ring" cx="50" cy="50" r="9" />
        <path class="vf-loader__mark vf-loader__top" d="M44 8 H68 C81.255 8 92 18.745 92 32 V56 H73 V33 C73 29.686 70.314 27 67 27 H44 Z" />
        <path class="vf-loader__mark vf-loader__bottom" d="M56 92 H32 C18.745 92 8 81.255 8 68 V44 H27 V67 C27 70.314 29.686 73 33 73 H56 Z" />
        <circle class="vf-loader__mark vf-loader__dot" cx="50" cy="50" r="9" />
      </g>
    </svg>
    <script type="module" src="src/index.jsx" onerror="alert('Loading error.')"></script>
  </body>
</html>
