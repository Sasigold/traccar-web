name: CI

# Lint, unit tests, production build and the e2e/a11y suite. Runs on every pull request into
# main and is called by deploy.yml, so nothing reaches production without passing it.
on:
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm ci --prefix demo
    - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    # FND-04: builds need an explicit fleet database; CI only checks that the app builds, so it
    # gets one that never resolves, for production and for staging.
    - run: npm run build
      env:
        VITE_FLEET_URL: https://fleet.ci.invalid
        VITE_FLEET_ANON_KEY: ci
    - run: npm run build -- --mode staging
      env:
        VITE_FLEET_URL: https://fleet.ci.invalid
        VITE_FLEET_ANON_KEY: ci

  e2e:
    # Smoke and WCAG 2.1 AA checks against the built-in demo server, desktop and phone.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm ci --prefix demo
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e -- --trace off
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results
        retention-days: 7

  database:
    # Applies every migration to a fresh Postgres on top of a stand-in of the VPS base schema,
    # then runs the row level security tests in supabase/tests/*.test.sql.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
    - uses: actions/checkout@v7
    - run: sh supabase/tests/run.sh
