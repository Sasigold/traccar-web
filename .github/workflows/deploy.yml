name: Deploy to staging

# FND-04: every push to main goes to STAGING, never straight to production. CI (lint, unit,
# build, e2e, database) must pass; the UI is built in a job that holds no secrets; a separate job
# without npm uploads it to the staging Traccar on the VPS, applies new migrations to the staging
# database and deploys the edge functions there. Production is "Promote to production"
# (promote.yml), run by hand.
#
# Until staging exists this workflow stops after CI. To turn it on, set these repository
# variables (Settings > Secrets and variables > Actions > Variables):
#   STAGING_WEB_DIR             e.g. /docker/traccar-staging/web (the staging Traccar's web folder)
#   STAGING_SITE_URL            e.g. https://traccar-staging.example.com
#   STAGING_FLEET_URL           the staging Supabase, e.g. https://viper-fleet-staging.example.com
#   STAGING_FLEET_ANON_KEY      its anon key (public by design)
#   STAGING_FLEET_DIR           e.g. /docker/viper-fleet-staging
#   STAGING_DB_CONTAINER        the staging database container name
#   STAGING_RUNTIME_CONTAINER   the staging edge-runtime container name
# and create a "staging" GitHub Environment. deploy/STAGING.md describes the server side.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: vars.STAGING_WEB_DIR != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    # Refuses to build if the staging address is missing or is the production database.
    - run: npm run build -- --mode staging
      env:
        VITE_FLEET_URL: ${{ vars.STAGING_FLEET_URL }}
        VITE_FLEET_ANON_KEY: ${{ vars.STAGING_FLEET_ANON_KEY }}
        # FND-06: error reports and analytics, off while these variables are empty (none secret).
        VITE_ERROR_DSN: ${{ vars.STAGING_ERROR_DSN }}
        VITE_ANALYTICS_PROVIDER: ${{ vars.STAGING_ANALYTICS_PROVIDER }}
        VITE_ANALYTICS_URL: ${{ vars.STAGING_ANALYTICS_URL }}
        VITE_ANALYTICS_SITE: ${{ vars.STAGING_ANALYTICS_SITE }}
    # FND-06: source maps (made only with an error service) never go to the site; they are kept
    # as their own artifact for the upload job below.
    - run: sh deploy/sourcemaps.sh split
    - uses: actions/upload-artifact@v7
      with:
        name: web-build-staging
        path: build
        retention-days: 7
    - uses: actions/upload-artifact@v7
      if: hashFiles('sourcemaps/**') != ''
      with:
        name: sourcemaps-staging
        path: sourcemaps
        retention-days: 7

  sourcemaps:
    # FND-06: the private source maps go to the error service, for readable stack traces. This
    # job holds only the error service's token (secret ERROR_AUTH_TOKEN), never the server key,
    # and runs only when ERROR_SOURCEMAPS_URL and STAGING_ERROR_PROJECT are set.
    needs: build
    if: vars.STAGING_ERROR_DSN != '' && vars.ERROR_SOURCEMAPS_URL != '' && vars.STAGING_ERROR_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - uses: actions/download-artifact@v7
      with:
        name: web-build-staging
        path: build
    - uses: actions/download-artifact@v7
      with:
        name: sourcemaps-staging
        path: sourcemaps
    - run: sh deploy/sourcemaps.sh upload
      env:
        SENTRY_URL: ${{ vars.ERROR_SOURCEMAPS_URL }}
        SENTRY_ORG: ${{ vars.ERROR_SOURCEMAPS_ORG }}
        SENTRY_PROJECT: ${{ vars.STAGING_ERROR_PROJECT }}
        SENTRY_AUTH_TOKEN: ${{ secrets.ERROR_AUTH_TOKEN }}

  deploy:
    # No npm here: third-party packages never run next to the server key.
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: ${{ vars.STAGING_WEB_DIR }}
      SITE_URL: ${{ vars.STAGING_SITE_URL }}
      FLEET_DIR: ${{ vars.STAGING_FLEET_DIR }}
      FLEET_URL: ${{ vars.STAGING_FLEET_URL }}
      DB_CONTAINER: ${{ vars.STAGING_DB_CONTAINER }}
      RUNTIME_CONTAINER: ${{ vars.STAGING_RUNTIME_CONTAINER }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: web-build-staging
        path: build

    - name: Configure SSH
      env:
        SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # SEC-21: the server's address and its pinned host key are repository variables
        # (DEPLOY_HOST = user@address, VPS_HOST_KEY = the line of `ssh-keyscan -t ed25519 <address>`).
        if [ -z "$DEPLOY_HOST" ] || [ -z "$VPS_HOST_KEY" ]; then
          echo "::error::Set the repository variables DEPLOY_HOST and VPS_HOST_KEY (deploy/SERVER-HARDENING.md)."
          exit 1
        fi
        printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

    - name: Upload to the staging Traccar (retries on connection problems)
      run: |
        for attempt in 1 2 3 4; do
          if SKIP_BUILD=1 sh deploy/deploy.sh; then exit 0; fi
          echo "Upload attempt $attempt failed, retrying in 30s..."
          sleep 30
        done
        echo "Upload failed after 4 attempts"; exit 1

    - name: Apply database migrations to staging
      run: sh deploy/migrate.sh

    - name: Deploy edge functions to staging
      run: sh deploy/functions.sh

    - name: Verify the release is served and its scripts load
      # On failure: sh deploy/deploy.sh rollback (the previous release is kept on the server).
      run: |
        sleep 3
        release=$(sed -n 's/.*"release": *"\([^"]*\)".*/\1/p' build/version.json)
        sh deploy/smoke.sh "$SITE_URL" "$release"

    - name: Remove the key
      if: always()
      run: rm -f ~/.ssh/id_ed25519
