name: Test

on:
  push:
    branches: [ master, custom-ui ]
  pull_request:
    branches: [ master, custom-ui ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm test

  e2e:
    # Smoke and WCAG 2.1 AA checks against the built-in demo server, desktop and phone.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm ci --prefix demo
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results
        retention-days: 7
