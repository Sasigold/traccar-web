name: Roll back

# FND-05: put the previous release back (or a named one), without a build. Every deploy keeps the
# last releases on the server next to the site (deploy/deploy.sh), so this is a copy and two
# renames. The database is not rolled back: migrations only add, and a rollback of the UI works
# with the newer schema.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'production or staging'
        required: true
        default: production
        type: choice
        options: [ production, staging ]
      release:
        description: 'Release folder to go back to (empty: the one before the current)'
        required: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: ${{ inputs.environment == 'production' && '/docker/traccar-ovjj/web' || vars.STAGING_WEB_DIR }}
      SITE_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_SITE_URL || vars.STAGING_SITE_URL }}
      RELEASE: ${{ inputs.release }}
    steps:
    - uses: actions/checkout@v7

    - name: Configure SSH
      env:
        SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # SEC-21: the server's address and its pinned host key are repository variables
        # (DEPLOY_HOST = user@address, VPS_HOST_KEY = the line of `ssh-keyscan -t ed25519 <address>`).
        if [ -z "$DEPLOY_HOST" ] || [ -z "$VPS_HOST_KEY" ]; then
          echo "::error::Set the repository variables DEPLOY_HOST and VPS_HOST_KEY (deploy/SERVER-HARDENING.md)."
          exit 1
        fi
        printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

    - name: Roll back
      run: |
        case "$RELEASE" in
          ''|*[!A-Za-z0-9.+_-]*) [ -z "$RELEASE" ] || { echo "Not a release name: $RELEASE"; exit 1; } ;;
        esac
        sh deploy/deploy.sh releases
        sh deploy/deploy.sh rollback $RELEASE

    - name: Verify
      run: sh deploy/smoke.sh "$SITE_URL"

    - name: Remove the key
      if: always()
      run: rm -f ~/.ssh/id_ed25519
