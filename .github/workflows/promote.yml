name: Promote to production

# FND-04: production is deployed by hand, from the branch or tag chosen in "Run workflow"
# (normally main, after checking it on staging). CI runs again on that exact commit; then the UI is
# built for production, uploaded to the Traccar container, new migrations are applied (with a
# database backup first) and the edge functions are deployed.
#
# The deploy job runs in the "production" GitHub Environment: add required reviewers there
# (Settings > Environments > production) so every promotion is approved.
#
# The production fleet database below is public by design (the anon key is RLS-restricted);
# repository variables PRODUCTION_FLEET_URL / PRODUCTION_FLEET_ANON_KEY override it. Once a
# staging stack runs on the same server, set PRODUCTION_DB_CONTAINER and
# PRODUCTION_RUNTIME_CONTAINER: the scripts refuse to guess between two containers.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to deploy this commit to production'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Confirmation
      # Through the environment, never pasted into the script.
      env:
        CONFIRM: ${{ inputs.confirm }}
      run: |
        if [ "$CONFIRM" != "production" ]; then
          echo 'Type "production" to confirm.'; exit 1
        fi

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run build
      env:
        VITE_FLEET_URL: ${{ vars.PRODUCTION_FLEET_URL }}
        VITE_FLEET_ANON_KEY: ${{ vars.PRODUCTION_FLEET_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkzODAyMjQ4LCJleHAiOjE5NTE0ODIyNDh9.2VsAyl2IFUy3QarPwReLOwcKhSthi62FZIyxs5YyrxU' }}
        # FND-06: error reports and analytics, off while these variables are empty (none secret).
        VITE_ERROR_DSN: ${{ vars.PRODUCTION_ERROR_DSN }}
        VITE_ANALYTICS_PROVIDER: ${{ vars.PRODUCTION_ANALYTICS_PROVIDER }}
        VITE_ANALYTICS_URL: ${{ vars.PRODUCTION_ANALYTICS_URL }}
        VITE_ANALYTICS_SITE: ${{ vars.PRODUCTION_ANALYTICS_SITE }}
    # FND-06: source maps (made only with an error service) never go to the site; they are kept
    # as their own artifact for the upload job below.
    - run: sh deploy/sourcemaps.sh split
    - uses: actions/upload-artifact@v7
      with:
        name: web-build-production
        path: build
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: hashFiles('sourcemaps/**') != ''
      with:
        name: sourcemaps-production
        path: sourcemaps
        retention-days: 7

  sourcemaps:
    # FND-06: the private source maps go to the error service, for readable stack traces. This
    # job holds only the error service's token (secret ERROR_AUTH_TOKEN), never the server key,
    # and runs only when ERROR_SOURCEMAPS_URL and PRODUCTION_ERROR_PROJECT are set.
    needs: build
    if: vars.PRODUCTION_ERROR_DSN != '' && vars.ERROR_SOURCEMAPS_URL != '' && vars.PRODUCTION_ERROR_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - uses: actions/download-artifact@v7
      with:
        name: web-build-production
        path: build
    - uses: actions/download-artifact@v7
      with:
        name: sourcemaps-production
        path: sourcemaps
    - run: sh deploy/sourcemaps.sh upload
      env:
        SENTRY_URL: ${{ vars.ERROR_SOURCEMAPS_URL }}
        SENTRY_ORG: ${{ vars.ERROR_SOURCEMAPS_ORG }}
        SENTRY_PROJECT: ${{ vars.PRODUCTION_ERROR_PROJECT }}
        SENTRY_AUTH_TOKEN: ${{ secrets.ERROR_AUTH_TOKEN }}

  deploy:
    # No npm here: third-party packages never run next to the server key.
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: /docker/traccar-ovjj/web
      SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      FLEET_URL: ${{ vars.PRODUCTION_FLEET_URL }}
      DB_CONTAINER: ${{ vars.PRODUCTION_DB_CONTAINER }}
      RUNTIME_CONTAINER: ${{ vars.PRODUCTION_RUNTIME_CONTAINER }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        name: web-build-production
        path: build

    - name: Configure SSH
      env:
        SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # SEC-21: the server's address and its pinned host key are repository variables
        # (DEPLOY_HOST = user@address, VPS_HOST_KEY = the line of `ssh-keyscan -t ed25519 <address>`).
        if [ -z "$DEPLOY_HOST" ] || [ -z "$VPS_HOST_KEY" ]; then
          echo "::error::Set the repository variables DEPLOY_HOST and VPS_HOST_KEY (deploy/SERVER-HARDENING.md)."
          exit 1
        fi
        printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts

    - name: Upload to VPS (retries on connection problems)
      run: |
        for attempt in 1 2 3 4; do
          if SKIP_BUILD=1 sh deploy/deploy.sh; then exit 0; fi
          echo "Upload attempt $attempt failed, retrying in 30s..."
          sleep 30
        done
        echo "Upload failed after 4 attempts"; exit 1

    - name: Apply database migrations
      # After the upload, so a failed migration never blocks the UI: without
      # it the admin area shows what is missing instead of breaking.
      run: sh deploy/migrate.sh

    - name: Deploy edge functions
      run: sh deploy/functions.sh

    - name: Verify the release is served and its scripts load
      # On failure: sh deploy/deploy.sh rollback (the previous release is kept on the server).
      run: |
        sleep 3
        release=$(sed -n 's/.*"release": *"\([^"]*\)".*/\1/p' build/version.json)
        sh deploy/smoke.sh "$SITE_URL" "$release"

    - name: Remove the key
      if: always()
      run: rm -f ~/.ssh/id_ed25519
