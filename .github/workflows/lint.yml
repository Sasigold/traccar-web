name: Run Lint

on:
  push:
    branches: [ master, custom-ui ]
  pull_request:
    branches: [ master, custom-ui ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        cache: npm
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm ci --prefix demo
    - run: npm run lint
